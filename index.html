<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Raihan_xo Study's</title>
<style>
body{background:#0f172a;color:white;text-align:center;font-family:sans-serif;padding:20px}
h1{color:#38bdf8;font-size:28px}
textarea{width:90%;max-width:500px;padding:14px;border-radius:12px;font-size:16px;border:none}
button{background:#38bdf8;color:#0f172a;padding:14px 35px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
button:active{transform:scale(0.95)}
#ans{background:#1e293b;padding:16px;border-radius:12px;max-width:600px;margin:25px auto;text-align:left;min-height:60px;white-space:pre-wrap;line-height:1.6}
small{color:#94a3b8}
</style>
 <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</head>
<body>
<h1>🔥 Raihan_xo Study's 🔥</h1>
<p>Vanakkam da! Raihan_xo-vin AI website!</p>
<textarea id="q" rows="4" placeholder="Enna venum ketu da..."></textarea><br>
<button onclick="ask()">Ask AI 🤖</button>
<div id="ans">Dei kelvi kelu da Raihan_xo!</div>
<small>Powered by Raihan_xo AI - No Login Needed</small>
<script>
async function ask(){
 let qq=document.getElementById("q").value;
 let a=document.getElementById("ans");
 if(!qq){a.innerText="Dei kelvi type pannu da!";return;}
 a.innerText="⏳ Yoosikiren da Raihan_xo...";
 try{
  let res=await fetch("https://text.pollinations.ai/"+encodeURIComponent(qq));
  let text=await res.text();
  a.innerText=text;
 }catch(e){
  a.innerText="Error da: "+e.message;
 }
}
</script>
</body>
</html>
