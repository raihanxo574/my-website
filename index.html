<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Study Hub</title>
<style>
body{background:#0f172a;color:white;text-align:center;font-family:sans-serif;padding:20px}
h1{color:#38bdf8}
textarea{width:90%;max-width:500px;padding:15px;border-radius:12px;font-size:16px}
button{background:#38bdf8;padding:14px 30px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
#ans{background:#1e293b;padding:15px;border-radius:12px;margin-top:20px;min-height:60px;text-align:left;white-space:pre-wrap;max-width:600px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<h1>🔥 AI Study Hub 🔥</h1>
<p>Vanakkam da! En AI website LIVE!</p>
<textarea id="q" rows="4" placeholder="What is AI?"></textarea><br>
<button id="b" onclick="ask()">Ask AI 🤖</button>
<div id="ans">Dei kelvi kelu da!</div>
<script>
const API_KEY="AQ.Ab8RN6J0yrVE6y-SkF727oDU4koU_QQX7IT1HG7Gtj6Z1ghZvQ";
async function ask(){
let qq=document.getElementById("q").value;
let a=document.getElementById("ans");
let b=document.getElementById("b");
if(!qq){alert("Kelvi type pannu da!");return}
b.innerText="⏳ Yosikuthu..."; a.innerText="Yosikuthu da...";
try{
let r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",{
method:"POST",
headers:{"Content-Type":"application/json","x-goog-api-key":API_KEY},
body:JSON.stringify({contents:[{parts:[{text:qq}]}]})});
let d=await r.json();
if(d.error){a.innerText="❌ "+d.error.message; b.innerText="Ask AI 🤖"; return;}
a.innerText=d.candidates[0].content.parts[0].text;
}catch(e){a.innerText="❌ "+e.message}
b.innerText="Ask AI 🤖";
}
</script>
</body>
</html>
