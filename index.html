<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f172a;color:white;text-align:center;font-family:sans-serif;padding:20px}
h1{color:#38bdf8}
textarea{width:90%;padding:15px;border-radius:12px;font-size:16px}
button{background:#38bdf8;padding:14px 30px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
#ans{background:#1e293b;padding:15px;border-radius:12px;margin-top:20px;min-height:60px;text-align:left;white-space:pre-wrap;word-wrap:break-word}
</style>
</head>
<body>
<h1>🔥 AI Study Hub 🔥</h1>
<p>Vanakkam da! En AI website LIVE!</p>
<textarea id="q" rows="4" placeholder="Enna doubt da? Eg: What is AI?"></textarea><br>
<button id="btn" onclick="ask()">Ask AI 🤖</button>
<div id="ans">Dei kelvi kelu da! Naan answer panren!</div>
<script>
const k="AQ.Ab8RN6IUiAUosQ3zpzS2Kq-U_iYQAyetkMOIFTQT7buFpQhxww"
async function ask(){
let qq=document.getElementById("q").value.trim();
let aDiv=document.getElementById("ans");
let btn=document.getElementById("btn");
if(!qq){alert("Dei kelvi type pannu da!");return}
btn.innerText="⏳ Yosikuren...";
aDiv.innerText="⏳ AI yosikuthu da... konjam wait pannu...";
try{
let res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+K,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({contents:[{parts:[{text:qq}]}]})
});
let data=await res.json();
console.log(data);
if(data.error){
aDiv.innerText="❌ API Error da: "+data.error.message+"\n\nDei key ah check pannu! aistudio.google.com/apikey la puthu key eduthu paste pannu!";
btn.innerText="Ask AI 🤖";
return;
}
if(data.candidates && data.candidates[0]){
let txt=data.candidates[0].content.parts[0].text;
aDiv.innerText=txt;
}else{
aDiv.innerText="❌ Response illa da: "+JSON.stringify(data).substring(0,300);
}
}catch(err){
aDiv.innerText="❌ Network Error da: "+err.message;
}
btn.innerText="Ask AI 🤖";
}
</script>
</body>
</html>
